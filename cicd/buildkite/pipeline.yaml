agents:
  queue: "local"

steps:
  - label: Hello, World
    command: echo "Hello, World"
  - label: push image
    plugins:
      - docker-login#v3.1.0:
          username: admin
          password-env: HARBOR_PASSWORD
    commands:
      - TAG="$${BUILDKITE_COMMIT:0:7}"
      - docker build -t "$$HARBOR/library/competition:$$TAG" ./backend
      - docker push "$$HARBOR/competition:$$TAG"
